<div class="container my-5">
  <h2 class="text-light mb-4 text-uppercase" style="letter-spacing: 1px;">
    Resultados para: <span style="color: #bb86fc;">"{{ termoBuscado }}"</span>
  </h2>

  @if (produtosFiltrados.length === 0) {
    <div class="text-center my-5 py-5 border shadow-sm" style="background-color: #1a1a1a; border-color: #333 !important; border-radius: 8px;">
      <h4 class="text-secondary mb-4">Nenhuma camiseta encontrada :[</h4>
      <button class="btn btn-outline-light px-4" routerLink="/">VOLTAR PARA A VITRINE</button>
    </div>
  } 
  
  @else {
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
      @for (produto of produtosFiltrados; track produto.codigo) {
        <div class="col">
          <div class="card h-100 bg-dark text-light border-secondary">
            <img src="{{ produto.codigo }}.jpg" class="card-img-top" alt="{{ produto.nome }}" style="height: 250px; object-fit: cover;">
            
            <div class="card-body d-flex flex-column">
              <h5 class="card-title fw-bold">{{ produto.nome }}</h5>
              <p class="card-text text-secondary mb-4">{{ produto.descricao }}</p>
              
              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fs-5 fw-bold" style="color: #bb86fc;">R$ {{ produto.preco | number:'1.2-2' }}</span>
                <a [routerLink]="['/detalhe', produto.codigo]" class="btn btn-sm btn-outline-light px-3 fw-bold">VER MAIS</a>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
