<div class="container my-5">
  
  @if (produto) {
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="p-3 d-flex justify-content-center align-items-center" style="background-color: #1a1a1a; border: 1px solid #333333; border-radius: 8px;">
          <img src="{{ produto.codigo }}.jpg" 
               class="img-fluid" 
               style="max-height: 500px; object-fit: cover; border-radius: 4px;" 
               alt="{{ produto.nome }}">
        </div>
      </div>

      <div class="col-md-6 d-flex flex-column justify-content-center text-light">
        <h1 class="fw-bold mb-3" style="letter-spacing: 1px;">{{ produto.nome }}</h1>
        
        <p class="mb-4 text-muted" style="line-height: 1.6;">
          Camiseta semioficial Black Sabbath. Malha 100% algodão com estampa de alta qualidade.
        </p>

        <h2 class="mb-4" style="color: #bb86fc; font-weight: 900; font-size: 2.5rem;">
          R$ {{ produto.preco | number:'1.2-2' }}
        </h2>

        <div class="d-grid gap-3 mt-2">

        <button class="btn btn-lg fw-bold" 
                style="background-color: #bb86fc; color: #121212; border: none;"
                (click)="adicionar()">
                ADICIONAR À CESTA
        </button>
          
          <button class="btn btn-outline-secondary btn-lg text-uppercase fw-bold" routerLink="/">
            Voltar para a Vitrine
          </button>
        </div>
      </div>
    </div>
  } 

  @else {
    <div class="text-center my-5 py-5 border" style="background-color: #1a1a1a; border-color: #333 !important; border-radius: 8px;">
      <h2 class="text-light mb-3">Produto não encontrado</h2>
      <p class="text-muted mb-4">Camiseta não disponível</p>
      <button class="btn btn-outline-light" routerLink="/">VOLTAR PARA A VITRINE</button>
    </div>
  }

</div>
