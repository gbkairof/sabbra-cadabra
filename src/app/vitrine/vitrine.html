<div class="container my-5">
  <div class="text-center mb-5">
    <h2 class="titulo-vitrine text-light text-uppercase fw-bold" style="letter-spacing: 2px;">Destaques do Sabbath</h2>
    <p class="text-secondary">As melhores camisetas semioficiais para a sua coleção</p>
  </div>

  <div class="row">
    @for (produto of produtos; track produto.nome) {
      <div class="col-12 col-md-6 col-lg-3 mb-4">
        <div class="cartao-produto p-3 text-center d-flex flex-column h-100" style="background-color: #1a1a1a; border: 1px solid #333333; border-radius: 8px;">
          
          <img src="{{ produto.codigo }}.jpg" 
            routerLink="/detalhe/{{ produto.codigo }}"
            class="img-fluid mb-3 w-100" 
            routerLink="/detalhe" 
            style="cursor: pointer; height: 280px; object-fit: cover; border-radius: 4px; border: 1px solid #333333;"
            alt="{{ produto.nome }}">
          
          <h4 class="nome-produto mt-auto text-light fw-bold" style="font-size: 1.1rem;">{{ produto.nome }}</h4>
          <p class="preco-produto my-2" style="color: #bb86fc; font-size: 1.3rem; font-weight: 900;">R$ {{ produto.preco }}</p>
          
        <a [routerLink]="['/detalhe', produto.codigo]" 
          class="btn w-100 fw-bold mt-3" 
          style="background-color: transparent; border: 1px solid #bb86fc; color: #bb86fc; transition: 0.3s;"
          onmouseover="this.style.backgroundColor='#bb86fc'; this.style.color='#121212';"
          onmouseout="this.style.backgroundColor='transparent'; this.style.color='#bb86fc';">
          COMPRAR
        </a>
          
        </div>
      </div>
    }
  </div>
</div>
